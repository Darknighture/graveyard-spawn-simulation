<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>墓园生成位置模拟</title>
<style>
  :root{
    --bg:#f4f5f8; --card:#fff; --line:#e3e6ec;
    --ink:#1f2328; --ink-2:#5b6472; --ink-3:#8b94a3;
    --accent:#7c3aed; --accent-soft:#ede9fe; --gold:#d99a00;
    --enemy:#0e7490;   /* 敌方墓园配色（我方=紫，敌方=青） */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    padding:22px 20px 44px;}
  .wrap{max-width:1120px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}
  h1{font-size:19px;margin:0}
  .lang{
    font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;
    border:1px solid #c4b5fd;background:#ede9fe;color:#5b21b6;flex:none;
  }
  .lang:hover{background:#ddd6fe;border-color:#a78bfa}
  .sechint{font-weight:400;color:var(--ink-3)}
  .sub{font-size:12.5px;color:var(--ink-2);line-height:1.65;margin-bottom:16px}
  .sub b{color:var(--accent)}

  .layout{display:grid;grid-template-columns:auto minmax(300px,1fr);gap:18px;align-items:start}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
        box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .mapbox{position:relative;display:inline-block;line-height:0}
  canvas{border-radius:8px;display:block;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas.grabbing{cursor:grabbing}
  .tip{position:absolute;pointer-events:none;z-index:9;
    background:rgba(31,35,40,.94);color:#fff;font-size:11.5px;line-height:1.55;
    padding:6px 9px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .1s;
    box-shadow:0 3px 10px rgba(0,0,0,.2)}
  .tip.on{opacity:1}
  .tip b{color:#ffd75e}

  .sec{font-size:12px;font-weight:700;margin:0 0 9px;color:var(--ink)}
  .sec:not(:first-child){margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}

  .kv{display:flex;justify-content:space-between;align-items:center;gap:8px;
      font-size:12px;color:var(--ink-2);padding:3px 0;font-variant-numeric:tabular-nums}
  .kv b{color:var(--ink);font-weight:600}

  .seg{display:flex;margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;flex:1;padding:6px 8px;background:#fff;color:var(--ink-2)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{background:#f3f4f7}
  .seg button.on{background:var(--accent);color:#fff}
  .seg button.on:hover{filter:brightness(.92)}
  .seg button.on.enemy{background:var(--enemy)}
  .posrow{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink-2)}
  .posrow input{font:inherit;font-size:12px;width:62px;padding:4px 6px;border:1px solid var(--line);
    border-radius:6px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}

  button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;
    color:var(--ink);padding:6px 11px;border-radius:7px;cursor:pointer}
  button:hover{background:#f3f4f7;border-color:#cfd4dd}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(.92)}   /* 用 filter 以便跟随阵营配色 */

  .ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
  .speed{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
    background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:var(--accent);border:2px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}
  #speed{width:96px}
  #scrub{width:100%}

  .hud{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0 4px}
  .hud div{font-size:11.5px;color:var(--ink-3)}
  .hud b{display:block;font-size:14px;color:var(--ink);font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:.3px}

  .timeline{position:relative;height:28px;margin-top:6px}
  .timeline .track{position:absolute;top:9px;left:0;right:0;height:5px;border-radius:3px;background:#e8eaf0}
  .timeline .fill{position:absolute;top:9px;left:0;height:5px;border-radius:3px;background:var(--accent);width:0}
  .tick{position:absolute;top:1px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;
    background:#fff;border:2px solid var(--ink-3);cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-size:8px;font-weight:700;color:var(--ink-3);transition:transform .12s}
  .tick:hover{transform:scale(1.25)}
  .tick.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .tick.done.repeat{background:var(--gold);border-color:var(--gold)}
  .tick.active{box-shadow:0 0 0 4px var(--accent-soft)}

  table{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
  th{text-align:left;font-size:10.5px;color:var(--ink-3);font-weight:600;padding:5px 4px;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:5px 4px;border-bottom:1px solid #f1f2f5;color:var(--ink-3)}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:#f7f8fa}
  tbody tr.done td{color:var(--ink)}
  tbody tr.active td{background:var(--accent-soft);color:var(--ink);font-weight:600}
  .pill{display:inline-block;min-width:30px;text-align:center;padding:1px 5px;border-radius:9px;
    font-size:10.5px;font-weight:600;background:#f0f1f4;color:var(--ink-2)}
  tr.done .pill{background:var(--accent);color:#fff}
  tr.done.repeat .pill{background:var(--gold);color:#fff}
  .ok{color:#15803d}
  .warn{color:#b45309;font-weight:600}
  .err{color:#b91c1c;font-weight:600}

  .note{font-size:11px;color:var(--ink-3);line-height:1.75;margin-top:14px;padding-top:12px;
        border-top:1px dashed var(--line)}
  kbd{font-family:inherit;font-size:10.5px;background:#f0f1f4;border:1px solid var(--line);
      border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1 data-i18n="title"></h1>
    <button id="btnLang" class="lang">EN</button>
  </div>
  <div class="sub" data-i18n-html="intro"></div>

  <div class="layout">
    <!-- ============ 地图 ============ -->
    <div class="card mapbox">
      <canvas id="cv"></canvas>
      <div class="tip" id="tip"></div>
    </div>

    <!-- ============ 侧栏 ============ -->
    <div class="card">
      <p class="sec"><span data-i18n="secDrop"></span>
        <span class="sechint" data-i18n="secDropHint"></span></p>
      <div class="seg">
        <button id="btnAlly" class="ally" data-i18n="sideAlly"></button>
        <button id="btnEnemy" class="enemy" data-i18n="sideEnemy"></button>
      </div>
      <div class="posrow">
        <span>col</span><input type="number" id="inCol" step="0.5" min="0" max="18">
        <span>row</span><input type="number" id="inRow" step="0.5" min="0" max="32">
      </div>
      <div class="kv"><span data-i18n="kvTile"></span><b id="posTile">—</b></div>
      <div class="kv"><span data-i18n="kvRadius"></span><b id="radTxt">—</b></div>
      <div class="kv"><span data-i18n="kvDuration"></span><b id="durTxt">—</b></div>

      <p class="sec" data-i18n="secPlay"></p>
      <div class="ctrls">
        <button id="btnPlay" class="primary"></button>
        <button id="btnRestart" data-i18n-title="btnRestart">↻</button>
        <button id="btnPrev" data-i18n-title="btnPrev">⏮</button>
        <button id="btnNext" data-i18n-title="btnNext">⏭</button>
        <label class="speed"><input type="range" id="speed" min="0.1" max="2" step="0.1" value="1">
          <span id="speedVal">1.0×</span></label>
      </div>

      <div class="hud">
        <div><span data-i18n="hudTime"></span><b><span id="clock">0.00</span> s</b></div>
        <div><span data-i18n="hudSpawned"></span><b id="cnt">0 / 12</b></div>
        <div><span data-i18n="hudLast"></span><b id="last">—</b></div>
        <div><span data-i18n="hudNext"></span><b id="next">—</b></div>
      </div>

      <input type="range" id="scrub" min="0" max="9" step="0.01" value="0">
      <div class="timeline" id="timeline"><div class="track"></div><div class="fill" id="fill"></div></div>

      <p class="sec" data-i18n="secSeq"></p>
      <table>
        <thead><tr>
          <th data-i18n="thStep">#</th><th data-i18n="thPoint"></th><th data-i18n="thCell"></th>
          <th data-i18n="thTile"></th><th data-i18n="thTime"></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="kv" style="margin-top:9px"><span data-i18n="kvDeployable"></span><b id="walk">—</b></div>

      <div class="note" data-i18n-html="note"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   1. 地图数据（tiles.xlsx）
      MAP[rTop][c]，rTop = 0 是最上面一行（xlsx 原顺序）
      展示用 row = ROWS-1-rTop（左下原点，向上递增）
   ========================================================= */
const RAW = [
  "000000111111000000","111111133331111111","111111133331111111","111111133331111111",
  "111111133331111111","113331111111133311","113331111111133311","113331111111133311",
  "111111111111111111","111111111111111111","111111111111111111","111111111111111111",
  "111111111111111111","111111111111111111","011111111111111110","444144444444441444",
  "444144444444441444","011111111111111110","111111111111111111","111111111111111111",
  "111111111111111111","111111111111111111","111111111111111111","111111111111111111",
  "112221111111122211","112221111111122211","112221111111122211","111111122221111111",
  "111111122221111111","111111122221111111","111111122221111111","000000111111000000"
];
const ROWS = RAW.length, COLS = RAW[0].length;
const MAP  = RAW.map(r => r.split('').map(Number));
const META = {
  0:{name:'不可部署'}, 1:{name:'可部署'}, 2:{name:'蓝方塔'}, 3:{name:'红方塔'}, 4:{name:'河道'}
};

/* =========================================================
   2. 墓园数据（gy4.py，y 向上为正）
   ========================================================= */
const SPELL_RADIUS = 4000;
const DURATION     = 9000;
const sec = ms => (ms/1000).toFixed(2);   // 内部一律用 ms，显示统一转秒

/* =========================================================
   2b. 中英文文案
   ========================================================= */
const LANG = {
  zh: {
    docTitle:'墓园生成位置模拟',
    title:'墓园生成位置模拟',
    intro:'墓园小骷髅的 <b>生成序列</b> 和 <b>模式</b>  在皇室战争 32×18 竞技场上。'+
          '紫色圆为法术范围（半径 <b>4 格</b>），圆内 8 个灰点为固定生成点位。'+
          '<b>按住拖动</b>移动落点，<b>双击</b>播放，<b>播放中单击</b>暂停。',
    secDrop:'墓园落点', secDropHint:'（拖动地图 / 填坐标，双击播放）',
    sideAlly:'我方墓园', sideEnemy:'敌方墓园',
    kvTile:'格坐标 (col, row)', kvRadius:'法术半径', kvDuration:'法术维持',
    secPlay:'播放控制', btnPlay:'▶ 播放', btnPause:'❚❚ 暂停',
    btnRestart:'重新开始', btnPrev:'上一只', btnNext:'下一只',
    hudTime:'当前时间', hudSpawned:'已生成', hudLast:'最近一次', hudNext:'下一次',
    secSeq:'生成序列',
    thStep:'#', thPoint:'点位', thCell:'落点格', thTile:'地块', thTime:'时间 (s)',
    kvDeployable:'落点可部署',
    note:'<b>双击地图</b>：从 0 重新播放一轮（<b>不会</b>改变落点）<br>'+
         '<b>播放中单击</b>：暂停（也不会改变落点）<br>'+
         '<b>墓园不能部署</b>在灰色格子上，拖过去会自动停在最近的合法位置（法术圈会变红提示）<br>'+
         '<kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 逐只跳转 · <kbd>R</kbd> 重置<br>'+
         '白点=该点位第 1 次出现，黄点=第 2 次及以上。',
    tile0:'不可部署', tile1:'可部署', tile2:'蓝方塔', tile3:'红方塔', tile4:'河道',
    out:'场外', end:'本轮结束', dash:'—', bridge:'桥面',
    towerRed:'红方', towerBlue:'蓝方', towerKing:'王塔', towerLeft:'左塔', towerRight:'右塔',
    oob:(c,r)=>`界外 (${c}, ${r})`,
    unitTile:'格',
    tileLabel:(c,r)=>`格 (col ${c}, row ${r})`,
    distLabel:d=>`距墓园圆心 <b>${d}</b> 格`,
    inRange:' <b>（范围内）</b>',
    nextIn:s=>`${s}s 后`,
    tickTitle:(s)=>`#${s.step} · P${s.id} · ${sec(s.time)} s`
  },
  en: {
    docTitle:'Graveyard Spawn Simulation',
    title:'Graveyard Spawn Simulation',
    intro:'Graveyard Skeleton <b>Spawn Sequence</b> and <b>Pattern</b> onto the Clash Royale 32×18 arena. '+
          'The purple circle is the spell area (radius <b>4 tiles</b>); the 8 grey dots are the fixed spawn points. '+
          '<b>Drag</b> to move the drop point, <b>double-click</b> to play, <b>single-click while playing</b> to pause. ',
    secDrop:'Drop Point', secDropHint:'(drag the map / type coords / double-click to play)',
    sideAlly:'Ally Graveyard', sideEnemy:'Enemy Graveyard',
    kvTile:'Tile (col, row)', kvRadius:'Spell Radius', kvDuration:'Spell Duration',
    secPlay:'Playback', btnPlay:'▶ Play', btnPause:'❚❚ Pause',
    btnRestart:'Restart', btnPrev:'Previous', btnNext:'Next',
    hudTime:'Time', hudSpawned:'Spawned', hudLast:'Last', hudNext:'Next',
    secSeq:'Spawn Sequence',
    thStep:'#', thPoint:'Point', thCell:'Landing Tile', thTile:'Terrain', thTime:'Time (s)',
    kvDeployable:'Deployable Landings',
    note:'<b>Double-click</b> the map: replay from 0 (drop point <b>is not</b> moved)<br>'+
         '<b>Single-click while playing</b>: pause (drop point is not moved either)<br>'+
         '<b>Graveyard cannot be deployed</b> on grey tiles — dragging over them holds the '+
         'last valid position (the circle turns red)<br>'+
         '<kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> step through · <kbd>R</kbd> reset<br>'+
         'White = 1st appearance at that point, yellow = 2nd or later.',
    tile0:'Not Deployable', tile1:'Deployable', tile2:'Blue Tower', tile3:'Red Tower', tile4:'River',
    out:'Off-map', end:'Finished', dash:'—', bridge:'Bridge',
    towerRed:'Red', towerBlue:'Blue', towerKing:'King', towerLeft:'Left', towerRight:'Right',
    oob:(c,r)=>`Out of bounds (${c}, ${r})`,
    unitTile:'tiles',
    tileLabel:(c,r)=>`Tile (col ${c}, row ${r})`,
    distLabel:d=>`<b>${d}</b> tiles from centre`,
    inRange:' <b>(in range)</b>',
    nextIn:s=>`in ${s}s`,
    tickTitle:(s)=>`#${s.step} · P${s.id} · ${sec(s.time)} s`
  }
};
let lang = 'zh';
const L = k => (LANG[lang][k] !== undefined ? LANG[lang][k] : LANG.zh[k]);
// 8 个生成位置（固定，不随象限改变）。4 象限镜像只改变“生成顺序”——
// 即每一步落到哪个点位，而不是移动点位本身。
const LOCATIONS = {
  1:[0,-3500], 2:[-3500,0], 3:[-2500,-2500], 4:[0,3500],
  5:[3500,0],  6:[2500,2500], 7:[-2500,2500], 8:[2500,-2500]
};
const SEQUENCE = [2,3,4,5,6,2,4,7,5,1,8,3];
const DELAYS   = [2200,2700,3300,3800,4400,4900,5500,6000,6500,7100,7600,8200];
const seen = {};
const SPAWNS = SEQUENCE.map((id,i)=>{
  seen[id] = (seen[id]||0)+1;
  return {step:i+1, id, time:DELAYS[i], ox:LOCATIONS[id][0], oy:LOCATIONS[id][1], nth:seen[id]};
});

/* =========================================================
   3. 塔识别（连通域，用 rTop 索引）
   ========================================================= */
function components(val){
  const seen = Array.from({length:ROWS},()=>new Array(COLS).fill(false));
  const out = [];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(seen[r][c] || MAP[r][c]!==val) continue;
    const q=[[r,c]]; seen[r][c]=true;
    let r0=r,r1=r,c0=c,c1=c;
    while(q.length){
      const [y,x]=q.pop();
      r0=Math.min(r0,y); r1=Math.max(r1,y); c0=Math.min(c0,x); c1=Math.max(c1,x);
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dy,dx])=>{
        const ny=y+dy,nx=x+dx;
        if(ny>=0&&ny<ROWS&&nx>=0&&nx<COLS&&!seen[ny][nx]&&MAP[ny][nx]===val){
          seen[ny][nx]=true; q.push([ny,nx]);
        }
      });
    }
    const w=c1-c0+1, h=r1-r0+1, cc=(c0+c1)/2;
    out.push({r0,r1,c0,c1,w,h,
      label: (w===4&&h===4) ? 'king' : ((cc < (COLS-1)/2) ? 'left' : 'right')});
  }
  return out;
}
const TOWERS = [
  ...components(3).map(t=>({...t, side:'red'})),
  ...components(2).map(t=>({...t, side:'blue'}))
];
// 桥（rTop 索引）
const riverRowSet = new Set();
for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(MAP[r][c]===4){ riverRowSet.add(r); break; }
const BRIDGE_SET = new Set();
riverRowSet.forEach(r=>{ for(let c=0;c<COLS;c++) if(MAP[r][c]===1) BRIDGE_SET.add(r+','+c); });

/* =========================================================
   4. 坐标系（原点在左下角）
      tc : 0..COLS  从左往右
      tr : 0..ROWS  从下往上（bottom-origin，可用小数）
      数组行 rTop = ROWS-1-row，展示行 row = ROWS-1-rTop
      界面上只用「格」这一个单位，UPT 仅用于把 gy4.py 的原始单位
      （4000 / 3500 / 2500 …）换算成格。
   ========================================================= */
const UPT = 1000;                               // 固定：1 格 = 1000 单位
const radiusTiles = () => SPELL_RADIUS / UPT;   // = 4 格

let center = { tc: 9, tr: 22 };   // 红半场空地（bottom-origin）

/* ---- 生成顺序的镜像 ----
   位置(坐标)本身永远不动，落点集合始终是那个对称环形；
   镜像只改每一步“先落在哪个点位”（生成顺序）。

   两个独立的翻转开关，叠在「基准顺序」上：
     ① 列   ：右列 不翻；左列 = 右列的**左右镜像**（水平翻转 HMIR）
     ② 阵营 ：我方 不翻；敌方 = 我方的**上下翻转**（垂直翻转 VMIR）
   两者互相独立，所以 2×2 = 4 种组合恰好得到 4 套各不相同的顺序
   （= 生成环的 4 个对称变换：基准 / 水平镜像 / 垂直镜像 / 中心对称），
   不会出现两种组合撞成同一套顺序的情况。

   基准顺序（= 我方 · 右列，用户确认这个是对的）：VMIR[HMIR[id]] —— 即中心对称(旋转180°)。 */
let side = 'ally';                                  // 'ally' 我方 | 'enemy' 敌方
const HMIR = {1:1,2:5,3:8,4:4,5:2,6:7,7:6,8:3};   // 左右镜像：x → -x
const VMIR = {1:4,2:2,3:7,4:1,5:5,6:8,7:3,8:6};   // 上下镜像：y → -y
function effId(id){
  let r = VMIR[HMIR[id]];              // 基准 = 我方右列（中心对称）
  if(center.tc < COLS/2) r = HMIR[r];  // ① 左列 = 右列的左右镜像（水平翻转）
  if(side === 'enemy')   r = VMIR[r];  // ② 敌方 = 我方的上下翻转（垂直翻转）
  return r;
}
/* 法术圈配色：我方=紫，敌方=青（红 #dc2626 仍留给“不可部署”报错态） */
const gyColor = () => (side === 'enemy')
  ? {main:'#0e7490', fill:'rgba(14,116,144,.13)', dot:'rgba(14,116,144,.35)',
     dotS:'rgba(14,116,144,.75)', ripple:'14,116,144'}
  : {main:'#a020f0', fill:'rgba(160,32,240,.13)', dot:'rgba(160,32,240,.35)',
     dotS:'rgba(160,32,240,.75)', ripple:'124,58,237'};

/* 墓园能否落在这里：只有「不可部署」(0) 的斜纹格不行。
   河道 (4) 和塔 (2/3) 上是允许落墓园的 —— 实战中墓园本来就是往塔上丢的。 */
function deployable(tc, tr){
  const q = tileAt(tc, tr);
  return q.inside && q.v !== 0;
}

/* 连续(bottom-origin)格坐标 → 格子信息 */
function tileAt(tc, tr){
  const inside = tc>=0 && tc<=COLS && tr>=0 && tr<=ROWS;
  const c  = Math.min(COLS-1, Math.max(0, Math.floor(tc)));
  const row= Math.min(ROWS-1, Math.max(0, Math.floor(tr)));   // bottom-origin 行号
  const rTop = ROWS-1-row;
  return {c, row, rTop, inside, raw:{c:Math.floor(tc), row:Math.floor(tr)},
          v: inside ? MAP[rTop][c] : null};
}

/* =========================================================
   5. 画布
   ========================================================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const PADL = 30, PADT = 22, PADR = 26, PADB = 16;   // 右侧/下方要留坐标
let TILE = 26;

function layout(){
  const availW = Math.min(window.innerWidth - 90, 520);
  const maxH   = (window.innerHeight || 900) * 0.84;
  let t = Math.floor((availW - PADL - PADR) / COLS);
  t = Math.min(t, Math.floor((maxH - PADT - PADB) / ROWS));
  TILE = Math.max(10, Math.min(34, t));
  const W = PADL + COLS*TILE + PADR, H = PADT + ROWS*TILE + PADB;
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(W*dpr);
  cv.height = Math.round(H*dpr);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
const px = tc   => PADL + tc*TILE;            // 列 → 屏幕 x
const pyTop = rTop => PADT + rTop*TILE;       // 数组行 → 屏幕 y
const py = tr   => PADT + (ROWS - tr)*TILE;   // bottom-origin → 屏幕 y

let t = 0, playing = false, speed = 1, lastTs = 0, animT = 0;
let hover = null, dragging = false;

/* =========================================================
   6. 绘制
   ========================================================= */
function draw(){
  const W = PADL + COLS*TILE + PADR, H = PADT + ROWS*TILE + PADB;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#fbfbfd'; ctx.fillRect(0,0,W,H);

  /* --- 地块 --- */
  for(let rTop=0;rTop<ROWS;rTop++) for(let c=0;c<COLS;c++){
    const v = MAP[rTop][c], x = px(c), y = pyTop(rTop);
    if(v===0){
      ctx.fillStyle='#6b7079'; ctx.fillRect(x,y,TILE,TILE);
      ctx.save(); ctx.beginPath(); ctx.rect(x,y,TILE,TILE); ctx.clip();
      ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=Math.max(1,TILE*0.11);
      for(let k=-TILE;k<TILE*2;k+=Math.max(4,TILE*0.34)){
        ctx.beginPath(); ctx.moveTo(x+k,y+TILE); ctx.lineTo(x+k+TILE,y); ctx.stroke();
      }
      ctx.restore();
    } else if(v===4){
      ctx.fillStyle='#7cc7f0'; ctx.fillRect(x,y,TILE,TILE);
    } else if(v===1){
      const row = ROWS-1-rTop;
      ctx.fillStyle = (row+c)%2 ? '#cfe3ac' : '#c8dfa2'; ctx.fillRect(x,y,TILE,TILE);
    } else {
      ctx.fillStyle = v===2 ? '#bfdbfe' : '#fecaca'; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle = v===2 ? '#3b82f6' : '#ef4444';
      ctx.fillRect(x+TILE*0.08, y+TILE*0.08, TILE*0.84, TILE*0.84);
    }
  }

  /* --- 河道波浪 --- */
  const riverCells = [];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(MAP[r][c]===4) riverCells.push([r,c]);
  if(riverCells.length){
    ctx.save(); ctx.beginPath();
    riverCells.forEach(([r,c])=>ctx.rect(px(c),pyTop(r),TILE,TILE));
    ctx.clip();
    const rr=[...new Set(riverCells.map(p=>p[0]))];
    const y0=pyTop(Math.min(...rr)), y1=pyTop(Math.max(...rr)+1);
    ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=Math.max(1,TILE*0.1);
    for(let L=0;L<3;L++){
      const baseY = y0 + (y1-y0)*(0.28+L*0.24), amp=(y1-y0)*0.055;
      ctx.beginPath();
      for(let x=px(0);x<=px(COLS);x+=3){
        const yy = baseY + Math.sin(x*0.055 + animT*0.0016 + L*1.3)*amp;
        x===px(0) ? ctx.moveTo(x,yy) : ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  /* --- 桥面 --- */
  BRIDGE_SET.forEach(k=>{
    const [rTop,c]=k.split(',').map(Number);
    const x=px(c), y=pyTop(rTop);
    ctx.fillStyle='#d9b678'; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle='rgba(0,0,0,.13)';
    for(let i=1;i<3;i++) ctx.fillRect(x, y+TILE*i/3, TILE, Math.max(1,TILE*0.07));
  });

  /* --- 网格 --- */
  ctx.strokeStyle='rgba(31,35,40,.13)'; ctx.lineWidth=1; ctx.beginPath();
  for(let c=0;c<=COLS;c++){ ctx.moveTo(px(c)+.5,pyTop(0)); ctx.lineTo(px(c)+.5,pyTop(ROWS)); }
  for(let r=0;r<=ROWS;r++){ ctx.moveTo(px(0),pyTop(r)+.5); ctx.lineTo(px(COLS),pyTop(r)+.5); }
  ctx.stroke();
  ctx.strokeStyle='#9aa2b1'; ctx.lineWidth=1.5;
  ctx.strokeRect(px(0)-.5, pyTop(0)-.5, COLS*TILE+1, ROWS*TILE+1);

  /* --- 行列号（列从左到右，行从下到上） --- */
  if(TILE>=13){
    ctx.font='600 10px "Segoe UI",sans-serif';
    // 上：列号
    ctx.fillStyle='#9aa2b1';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    for(let c=0;c<COLS;c++) ctx.fillText(String(c), px(c)+TILE/2, pyTop(0)-4);
    // 下：列号
    ctx.textBaseline='top';
    for(let c=0;c<COLS;c++) ctx.fillText(String(c), px(c)+TILE/2, pyTop(ROWS)+4);
    // 左：行号（左下原点：数组行 rTop=0 在最上，展示行 = ROWS-1-rTop）
    ctx.textAlign='right'; ctx.textBaseline='middle';
    for(let rTop=0;rTop<ROWS;rTop++)
      ctx.fillText(String(ROWS-1-rTop), px(0)-5, pyTop(rTop)+TILE/2);
    // 右：行号
    ctx.textAlign='left';
    for(let rTop=0;rTop<ROWS;rTop++)
      ctx.fillText(String(ROWS-1-rTop), px(COLS)+5, pyTop(rTop)+TILE/2);
  }

  /* --- 镜像分界：场地中线（col 9 / row 16） --- */
  ctx.save();
  ctx.setLineDash([5,5]); ctx.lineWidth=1.2; ctx.strokeStyle='rgba(31,35,40,.30)';
  ctx.beginPath();
  ctx.moveTo(px(COLS/2), pyTop(0)); ctx.lineTo(px(COLS/2), pyTop(ROWS));
  ctx.moveTo(px(0), py(ROWS/2));    ctx.lineTo(px(COLS), py(ROWS/2));
  ctx.stroke();
  ctx.restore();

  /* ============ 墓园法术范围 ============ */
  const cx0 = px(center.tc), cy0 = py(center.tr), R = radiusTiles()*TILE;
  const okPlace = deployable(center.tc, center.tr);          // 圆心是否可部署
  const GY = gyColor();                                        // 我方紫 / 敌方青
  const C1 = okPlace ? GY.main : '#dc2626';                    // 不可部署 → 整圈变红
  const C2 = okPlace ? GY.fill : 'rgba(220,38,38,.13)';
  const C3 = okPlace ? GY.dot  : 'rgba(220,38,38,.35)';
  const C4 = okPlace ? GY.dotS : 'rgba(220,38,38,.75)';

  ctx.save();
  ctx.beginPath(); ctx.rect(px(0), pyTop(0), COLS*TILE, ROWS*TILE); ctx.clip();

  ctx.beginPath(); ctx.arc(cx0, cy0, R, 0, Math.PI*2);
  ctx.fillStyle = C2; ctx.fill();
  ctx.setLineDash([7,5]); ctx.lineWidth=2; ctx.strokeStyle=C1; ctx.stroke();
  ctx.setLineDash([]);

  // 8 个固定生成点位（位置固定，镜像只体现在生成顺序上）
  Object.keys(LOCATIONS).forEach(id=>{
    const [ox,oy]=LOCATIONS[id];
    const sx = cx0 + ox/UPT*TILE, sy = cy0 - oy/UPT*TILE;
    ctx.beginPath(); ctx.arc(sx, sy, Math.max(2, TILE*0.12), 0, Math.PI*2);
    ctx.fillStyle=C3; ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle=C4; ctx.stroke();
  });

  // 圆心手柄
  ctx.beginPath(); ctx.arc(cx0, cy0, Math.max(8, TILE*0.34), 0, Math.PI*2);
  ctx.fillStyle = okPlace ? GY.fill : 'rgba(220,38,38,.16)'; ctx.fill();
  ctx.lineWidth=1.6; ctx.strokeStyle=C1; ctx.stroke();
  ctx.strokeStyle=C1; ctx.lineWidth=1.6; ctx.beginPath();
  ctx.moveTo(cx0-6,cy0); ctx.lineTo(cx0+6,cy0);
  ctx.moveTo(cx0,cy0-6); ctx.lineTo(cx0,cy0+6);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx0,cy0,3,0,Math.PI*2); ctx.fillStyle=C1; ctx.fill();
  ctx.restore();

  /* ============ 已生成的小骷髅 ============ */
  let count=0, lastSpawn=null;
  ctx.save();
  ctx.beginPath(); ctx.rect(px(0), pyTop(0), COLS*TILE, ROWS*TILE); ctx.clip();
  SPAWNS.forEach(s=>{
    if(s.time > t) return;
    count++; lastSpawn=s;
    const [ox, oy] = LOCATIONS[effId(s.id)];
    const sx = cx0 + ox/UPT*TILE, sy = cy0 - oy/UPT*TILE;
    const age = t - s.time;
    const pop = Math.min(1, age/220), ease = 1-Math.pow(1-pop,3);
    const rr = 4 + 7.5*ease;

    if(age < 900){
      const p = age/900;
      ctx.beginPath(); ctx.arc(sx, sy, rr+5+p*38, 0, Math.PI*2);
      ctx.strokeStyle=`rgba(${GY.ripple},${(1-p)*0.6})`;
      ctx.lineWidth=2.5*(1-p)+0.5; ctx.stroke();
    }
    if(age < 1400){
      ctx.beginPath(); ctx.arc(sx, sy, rr+6, 0, Math.PI*2);
      ctx.strokeStyle=`rgba(${GY.ripple},${(1-age/1400)*0.9})`; ctx.lineWidth=2; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(sx, sy, rr, 0, Math.PI*2);
    ctx.fillStyle = s.nth>=2 ? '#ffcc00' : '#ffffff'; ctx.fill();
    ctx.lineWidth=1.8; ctx.strokeStyle='#1f2328'; ctx.stroke();
    ctx.fillStyle='#1f2328';
    ctx.font=`700 ${Math.round(8+2*ease)}px "Segoe UI",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(s.step), sx, sy+0.5);
  });
  ctx.restore();

  /* --- 悬停高亮 --- */
  if(hover){
    const bad = hover.v === 0;                        // 不可部署格 → 红色提示
    ctx.strokeStyle = bad ? '#dc2626' : '#7c3aed'; ctx.lineWidth=2.5;
    ctx.strokeRect(px(hover.c)-1, pyTop(hover.rTop)-1, TILE+2, TILE+2);
    ctx.fillStyle = bad ? 'rgba(220,38,38,.18)' : 'rgba(124,58,237,.14)';
    ctx.fillRect(px(hover.c), pyTop(hover.rTop), TILE, TILE);
  }

  updateHUD(count, lastSpawn);
}

/* =========================================================
   7. 侧栏
   ========================================================= */
const $ = id => document.getElementById(id);
const el = {posTile:$('posTile'), radTxt:$('radTxt'), walk:$('walk'),
  clock:$('clock'), cnt:$('cnt'), last:$('last'), next:$('next'),
  fill:$('fill'), scrub:$('scrub'), tbody:$('tbody'), btnPlay:$('btnPlay'),
  inCol:$('inCol'), inRow:$('inRow'), durTxt:$('durTxt')};

function spawnInfo(s){
  const [ox, oy] = LOCATIONS[effId(s.id)];   // 位置固定，镜像只改顺序
  const tc = center.tc + ox/UPT;
  const tr = center.tr + oy/UPT;        // oy 向上为正 → tr 增大
  return {...tileAt(tc,tr), tc, tr};
}

const rows = SPAWNS.map(s=>{
  const tr = document.createElement('tr');
  if(s.nth>=2) tr.classList.add('repeat');
  tr.innerHTML =
    `<td>${s.step}</td>`+
    `<td><span class="pill">P${s.id}${s.nth>=2?' ×'+s.nth:''}</span></td>`+
    `<td class="cell">—</td><td class="tt">—</td><td>${sec(s.time)}</td>`;
  // 点位会随象限镜像改变，refreshInfo() 里按 effId 回填
  tr.addEventListener('click', ()=>{ pause(); seek(s.time+1); });
  el.tbody.appendChild(tr);
  return tr;
});

const ticks = SPAWNS.map(s=>{
  const d = document.createElement('div');
  d.className='tick'; d.style.left=(s.time/DURATION*100)+'%'; d.textContent=s.step;
  d.dataset.i = SPAWNS.indexOf(s);
  d.title = L('tickTitle')(s);
  d.addEventListener('click', ()=>{ pause(); seek(s.time+1); });
  $('timeline').appendChild(d);
  return d;
});

function setCenter(tc, tr){
  center = {tc, tr};
  refreshInfo(); draw();
}

function refreshInfo(){
  el.posTile.textContent = `(${center.tc.toFixed(1)}, ${center.tr.toFixed(1)})`;
  el.radTxt.textContent  = `${radiusTiles()} ${L('unitTile')}`;   // 4 格 / 4 tiles
  el.durTxt.textContent  = `${DURATION/1000} s`;       // 9 s
  if(document.activeElement !== el.inCol) el.inCol.value = center.tc;
  if(document.activeElement !== el.inRow) el.inRow.value = center.tr;

  let walkable = 0;
  SPAWNS.forEach((s,i)=>{
    const p = spawnInfo(s);
    const cellTd = rows[i].querySelector('.cell');
    const typeTd = rows[i].querySelector('.tt');
    const pill = rows[i].querySelector('.pill');
    if(pill) pill.textContent = `P${effId(s.id)}${s.nth>=2?' ×'+s.nth:''}`;
    if(p.inside){
      cellTd.textContent = `(${p.c}, ${p.row})`;
      if(p.v===1){ typeTd.textContent=L('tile1'); typeTd.className='tt ok'; walkable++; }
      else if(p.v===0){ typeTd.textContent=L('tile0'); typeTd.className='tt err'; }
      else if(p.v===4){ typeTd.textContent=L('tile4'); typeTd.className='tt warn'; }
      else { typeTd.textContent = L(p.v===3?'tile3':'tile2'); typeTd.className='tt err'; }
    } else {
      cellTd.textContent = L('oob')(p.raw.c, p.raw.row);
      typeTd.textContent = L('out'); typeTd.className='tt err';
    }
  });
  el.walk.textContent = `${walkable} / ${SPAWNS.length}`;
  el.walk.className = walkable===SPAWNS.length ? 'ok' : (walkable>=SPAWNS.length-2 ? 'warn':'err');
}

function updateHUD(count, lastSpawn){
  el.clock.textContent = sec(t);
  el.cnt.textContent   = count + ' / 12';
  el.last.textContent  = lastSpawn
    ? `#${lastSpawn.step} · P${lastSpawn.id} · ${sec(lastSpawn.time)}s` : L('dash');
  const nx = SPAWNS.find(s=>s.time>t);
  el.next.textContent  = nx
    ? `#${nx.step} · ${L('nextIn')(sec(nx.time - t))}` : L('end');

  el.fill.style.width = (t/DURATION*100)+'%';
  if(document.activeElement !== el.scrub) el.scrub.value = (t/1000).toFixed(2);

  rows.forEach((tr,i)=>{
    tr.classList.toggle('done', SPAWNS[i].time<=t);
    tr.classList.toggle('active', !!lastSpawn && SPAWNS[i].step===lastSpawn.step);
  });
  ticks.forEach((d,i)=>{
    d.classList.toggle('done', SPAWNS[i].time<=t);
    d.classList.toggle('repeat', SPAWNS[i].nth>=2);
    d.classList.toggle('active', !!lastSpawn && SPAWNS[i].step===lastSpawn.step);
  });
}

/* =========================================================
   8. 播放控制
   ========================================================= */
function loop(ts){
  if(playing){
    const dt = lastTs ? (ts-lastTs) : 0;
    t += dt*speed;
    if(t>=DURATION){ t=DURATION; pause(); }
  }
  animT = ts; lastTs = ts;
  draw();
  requestAnimationFrame(loop);
}
function updatePlayBtn(){
  el.btnPlay.textContent = playing ? L('btnPause') : L('btnPlay');
  el.btnPlay.classList.toggle('primary', !playing);
}
function play(){ if(t>=DURATION) t=0; playing=true; updatePlayBtn(); }
function pause(){ playing=false; updatePlayBtn(); }
function toggle(){ playing?pause():play(); }
function seek(v){ t = Math.max(0, Math.min(DURATION, v)); draw(); }

el.btnPlay.addEventListener('click', toggle);
$('btnRestart').addEventListener('click', ()=>{ pause(); seek(0); });
$('btnPrev').addEventListener('click', ()=>{
  pause(); const p=[...SPAWNS].reverse().find(s=>s.time < t-30); seek(p?p.time+1:0);
});
$('btnNext').addEventListener('click', ()=>{
  pause(); const n=SPAWNS.find(s=>s.time>t); seek(n?n.time+1:DURATION);
});
el.scrub.addEventListener('input', e=>{ pause(); seek(+e.target.value * 1000); });
$('speed').addEventListener('input', e=>{ speed=+e.target.value;
  $('speedVal').textContent = speed.toFixed(1)+'×'; });
el.inCol.addEventListener('input', ()=>{ const v=parseFloat(el.inCol.value);
  if(!isNaN(v)) setCenter(Math.max(0,Math.min(COLS,v)), center.tr); });
el.inRow.addEventListener('input', ()=>{ const v=parseFloat(el.inRow.value);
  if(!isNaN(v)) setCenter(center.tc, Math.max(0,Math.min(ROWS,v))); });
document.addEventListener('keydown', e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName||''))) return;
  if(e.code==='Space'){ e.preventDefault(); toggle(); }
  else if(e.code==='ArrowRight'){ e.preventDefault(); $('btnNext').click(); }
  else if(e.code==='ArrowLeft'){ e.preventDefault(); $('btnPrev').click(); }
  else if(e.key==='r'||e.key==='R'){ $('btnRestart').click(); }
});

/* =========================================================
   9. 指针交互：悬停 + 拖动落点
      用 pointer 事件 + setPointerCapture，拖出画布也不会断
   ========================================================= */
const tip = $('tip');

function cellAL(e){
  const b = cv.getBoundingClientRect();
  if(!b.width) return null;
  const x = (e.clientX - b.left) * (parseFloat(cv.style.width)  / b.width);
  const y = (e.clientY - b.top)  * (parseFloat(cv.style.height) / b.height);
  const tc = (x - PADL)/TILE;
  const tr = ROWS - (y - PADT)/TILE;        // 屏幕 y → bottom-origin
  if(tc<0 || tc>COLS || tr<0 || tr>ROWS) return null;
  const q = tileAt(tc, tr);
  return {x, y, tc, tr, c:q.c, row:q.row, rTop:q.rTop, v:q.v};
}

/* =========================================================
   点击 / 双击判定（鼠标与触屏通用）

   ⚠️ 不能用浏览器的 dblclick 事件 + e.detail 来判断第二下：
      · 触屏(pointerType==='touch')上 dblclick 经常压根不触发；
      · 且触屏 pointerdown 的 e.detail 恒为 0，`e.detail >= 2` 永远不成立，
        于是第二下又被当成"单击移动落点"，手机上就永远无法播放。
   所以这里自己按「两次 pointerup 的时间间隔 + 位置距离」判定双击。
   ========================================================= */
const DBL_MS   = 320;   // 两次点击的最大间隔
const DBL_DIST = 26;    // 位置容差（CSS px，手指没鼠标那么准）
let tapPrev = null;      // 上一次有效点击 {t, x, y}
let tapSnapshot = null;  // 这一串点击开始前的落点（双击后要还原回去）
let tapMoved = false;    // 本次按下是否发生了拖动
let suppressTap = false; // 播放中单击=暂停，这次抬起不再参与双击判定

function isDoubleTap(e, now){
  return !!tapPrev && (now - tapPrev.t) <= DBL_MS &&
         Math.hypot(e.clientX - tapPrev.x, e.clientY - tapPrev.y) <= DBL_DIST;
}

cv.addEventListener('pointerdown', e=>{
  if(e.button!==0) return;
  const p = cellAL(e); if(!p) return;
  e.preventDefault();

  // 播放中：单击只暂停，不动落点（暂停后可以再拖）
  if(playing){
    tapPrev = null; tapSnapshot = null;
    suppressTap = true;
    pause();
    return;
  }

  const now = Date.now();
  const is2nd = isDoubleTap(e, now);
  if(!is2nd) tapSnapshot = {...center};   // 新一轮点击才记快照，第二下不能覆盖它
  tapMoved = false;

  dragging = true;
  cv.classList.add('grabbing');
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(is2nd) return;                        // 第二下：不移动落点
  if(deployable(p.tc, p.tr)) setCenter(p.tc, p.tr);   // 不可部署格上点不动
});

cv.addEventListener('pointermove', e=>{
  const p = cellAL(e);
  if(!p){ hover=null; tip.classList.remove('on'); draw(); return; }

  if(dragging){
    // 墓园不能部署在「不可部署」格：拖过去时保持在最近一次合法位置
    if(deployable(p.tc, p.tr)){
      setCenter(p.tc, p.tr);
      tapMoved = true;                                // 拖动过就不算"点击"了
    }
  } else if(!hover || hover.rTop!==p.rTop || hover.c!==p.c){
    hover = p;
  } else {
    hover = p;
  }
  draw();

  const tower = TOWERS.find(tw => p.rTop>=tw.r0 && p.rTop<=tw.r1 && p.c>=tw.c0 && p.c<=tw.c1);
  let extra = '';
  if(tower){
    const sideK  = tower.side==='red'  ? 'Red'  : 'Blue';
    const labelK = tower.label==='king' ? 'King' : (tower.label==='left' ? 'Left' : 'Right');
    extra = `<br><b>${L('tower'+sideK)} ${L('tower'+labelK)} ${tower.w}×${tower.h}</b>`;
  }
  else if(BRIDGE_SET.has(p.rTop+','+p.c)) extra = `<br><b>${L('bridge')}</b>`;

  const dist = Math.hypot(p.tc - center.tc, p.tr - center.tr);      // 单位：格
  tip.innerHTML =
    `<b>${p.v} · ${L('tile'+p.v)}</b><br>`+
    `${L('tileLabel')(p.c, p.row)}<br>`+
    `${L('distLabel')(dist.toFixed(1))}` +
    (dist <= radiusTiles() ? L('inRange') : '') + extra;
  tip.classList.add('on');
  const flip = (parseFloat(cv.style.width) - p.x) < 200;
  tip.style.left = (cv.offsetLeft + p.x + (flip ? -200 : 14)) + 'px';
  tip.style.top  = (cv.offsetTop  + p.y + 14) + 'px';
});

function endDrag(e){
  if(!dragging) return;
  dragging = false;
  cv.classList.remove('grabbing');
  try{ cv.releasePointerCapture(e.pointerId); }catch(_){}
}
/* 双击：不改变落点，直接从 0 重新播放一轮（鼠标 / 手指通用） */
function handleTap(e){
  const now = Date.now();
  if(suppressTap){ suppressTap = false; return; }   // 刚才那一下是“暂停”
  if(tapMoved){ tapPrev = null; return; }           // 拖动过，不算点击

  if(isDoubleTap(e, now)){
    if(tapSnapshot){ center = {...tapSnapshot}; refreshInfo(); }  // 还原，双击不顶偏落点
    tapSnapshot = null; tapPrev = null;
    seek(0);
    play();
  } else {
    tapPrev = {t: now, x: e.clientX, y: e.clientY};
  }
}
cv.addEventListener('pointerup', e=>{ endDrag(e); handleTap(e); });
cv.addEventListener('pointercancel', e=>{
  endDrag(e);
  tapPrev = null; tapSnapshot = null; suppressTap = false;
});
window.addEventListener('blur', ()=>{ dragging=false; cv.classList.remove('grabbing'); });
cv.addEventListener('pointerleave', ()=>{ if(!dragging){ hover=null; tip.classList.remove('on'); draw(); } });

/* =========================================================
   10. 启动
   ========================================================= */
/* ---- 语言切换 ---- */
function applyLang(){
  document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';
  document.title = L('docTitle');
  document.getElementById('btnLang').textContent = (lang === 'zh') ? 'EN' : '中文';
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = L(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = L(e.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = L(e.dataset.i18nTitle); });
  ticks.forEach((d,i) => { d.title = L('tickTitle')(SPAWNS[i]); });
  updatePlayBtn();
  refreshInfo();
  draw();
}
$('btnLang').addEventListener('click', ()=>{
  lang = (lang === 'zh') ? 'en' : 'zh';
  $('btnLang').textContent = (lang === 'zh') ? 'EN' : '中文';
  applyLang();
});

/* ---- 部署方切换：我方 / 敌方（敌方 = 我方生成顺序上下翻转）----
   顺带把整套强调色 --accent / --accent-soft 换成阵营色，
   这样播放按钮、时间轴、刻度点、表格 pill、倍速滑块会一起跟着变，
   和地图上的法术圈配色保持一致（.lang 语言按钮已硬编码紫色，不受影响）。 */
function setSide(s){
  side = s;
  const rs = document.documentElement.style;
  if(side === 'enemy'){
    rs.setProperty('--accent', '#0e7490');       // 青
    rs.setProperty('--accent-soft', '#cffafe');
  } else {
    rs.removeProperty('--accent');               // 回落 :root 的紫色
    rs.removeProperty('--accent-soft');
  }
  $('btnAlly').classList.toggle('on',  side === 'ally');
  $('btnEnemy').classList.toggle('on', side === 'enemy');
  refreshInfo(); draw();
}
$('btnAlly').addEventListener('click',  ()=> setSide('ally'));
$('btnEnemy').addEventListener('click', ()=> setSide('enemy'));

window.addEventListener('resize', ()=>{ layout(); draw(); });
layout();
setSide(side);      // 初始化「我方/敌方」按钮高亮
applyLang();
requestAnimationFrame(loop);
</script>
